# Measured-savings experiment for the BciPy install bottleneck.
# The traces showed pip compiling wxPython from source (41,942 compiler runs)
# and the project being installed twice (`make dev-install` runs
# `pip install -e .[dev]` and then `make install`).
# Fixed: install the same wxPython version as a prebuilt wheel from the
# official wxPython Linux wheel index, and install the project once.
# Functionality checks: same wxPython version, environment fingerprint, and
# the workflow's own unit tests, type-check, and lint.
# One run each, same pinned source, no instrumentation.

name: savings-experiment

on:
  workflow_dispatch:
  push:
    branches:
      - savings-experiment

jobs:
  build-ubuntu:
    name: ${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        python-version: [3.10.6]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Update OS, pip & install custom dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtk-3-dev
        sudo apt-get install freeglut3-dev
        sudo apt-get install freetype*
        sudo apt-get install portaudio*
        sudo apt-get install libsndfile*
        sudo apt-get install xvfb
        python -m pip install --upgrade pip
        pip install attrdict3
        conda install -c conda-forge liblsl
    - name: Install dependencies
      run: |
        if [ "${{ matrix.variant }}" = "fixed" ]; then
          . /etc/os-release
          WX=$(pip index versions wxPython 2>/dev/null | head -1 | sed -E 's/.*\(([^)]+)\).*/\1/')
          echo "wxPython $WX (latest on PyPI), prebuilt wheel for Ubuntu $VERSION_ID"
          pip install --only-binary wxPython \
            -f "https://extras.wxpython.org/wxPython4/extras/linux/gtk3/ubuntu-${VERSION_ID}/" \
            "wxPython==$WX"
          pip install -e ".[dev]"
        else
          make dev-install
        fi
    - name: Check wxPython
      run: python -c "import wx; print('wxPython', wx.version())"
    - name: Environment fingerprint
      run: |
        echo "packages: $(pip freeze | wc -l)"
        echo "fingerprint: $(pip freeze | grep -viE '^(-e|#|bcipy)' | sort | sha256sum)"
    - name: Unit test
      if: always()
      run: |
        set +e
        xvfb-run coverage run --branch --source=bcipy -m pytest --mpl -k "not slow"
        if [ $? -eq 0 ]b
        then 
          echo "Ubuntu run complete!"
        elif [ $? -eq 134 ]
        then
          echo "Ubuntu tests run successfully, memory issues may be present"
          exit 0
        else 
          echo "Ubuntu test failure"
        fi
    - name: type-check
      run: |
        make type
    - name: lint
      run: |
        make lint
