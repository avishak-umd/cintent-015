# Measured-savings experiment for the BciPy install bottleneck.
# The traces showed pip compiling wxPython from source (41,942 compiler runs)
# on every run, and the project being installed twice (`make dev-install`
# runs `pip install -e .[dev]` and then `make install`).
# Fixed: reuse a wheel of the same wxPython version, built once and kept in
# the Actions cache (the `prepare` job fills the cache, as a first run
# would), and install the project once.
# Functionality checks: same wxPython version, same environment fingerprint,
# and the same outcome of the workflow's own unit tests, type-check and lint.
# One run each, same pinned source, no instrumentation.

name: savings-experiment

on:
  workflow_dispatch:
  push:
    branches:
      - savings-experiment

jobs:
  prepare:
    name: prepare-wx-wheel
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      wx: ${{ steps.ver.outputs.wx }}
      key: ${{ steps.ver.outputs.key }}
    steps:
    - uses: actions/setup-python@v2
      with:
        python-version: 3.10.6
    - name: Resolve wxPython version
      id: ver
      run: |
        python -m pip install --upgrade pip
        . /etc/os-release
        WX=$(pip index versions wxPython 2>/dev/null | head -1 | sed -E 's/.*\(([^)]+)\).*/\1/')
        echo "wxPython $WX"
        echo "wx=$WX" >> "$GITHUB_OUTPUT"
        echo "key=wx-$WX-py3.10.6-ubuntu-$VERSION_ID" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@v4
      id: cache
      with:
        path: wheelhouse
        key: ${{ steps.ver.outputs.key }}
    - name: Build wxPython wheel
      if: steps.cache.outputs.cache-hit != 'true'
      run: |
        sudo apt-get update
        sudo apt-get install -y libgtk-3-dev freeglut3-dev
        pip wheel --no-deps -w wheelhouse "wxPython==${{ steps.ver.outputs.wx }}"
        ls -la wheelhouse

  build-ubuntu:
    name: ${{ matrix.variant }}
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [baseline, fixed]
        python-version: [3.10.6]
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v2
      with:
        python-version: ${{ matrix.python-version }}
    - name: Update OS, pip & install custom dependencies
      run: |
        sudo apt-get update
        sudo apt-get install libgtk-3-dev
        sudo apt-get install freeglut3-dev
        sudo apt-get install freetype*
        sudo apt-get install portaudio*
        sudo apt-get install libsndfile*
        sudo apt-get install xvfb
        python -m pip install --upgrade pip
        pip install attrdict3
        conda install -c conda-forge liblsl
    - name: Restore wxPython wheel
      if: matrix.variant == 'fixed'
      uses: actions/cache/restore@v4
      with:
        path: wheelhouse
        key: ${{ needs.prepare.outputs.key }}
        fail-on-cache-miss: true
    - name: Install dependencies
      run: |
        if [ "${{ matrix.variant }}" = "fixed" ]; then
          pip install -f wheelhouse -e ".[dev]" 2>&1 | tee /tmp/install.log
          grep -i "wxpython" /tmp/install.log | head -5
        else
          make dev-install
        fi
    - name: Check wxPython
      run: python -c "import wx; print('wxPython', wx.version())"
    - name: Environment fingerprint
      run: |
        echo "packages: $(pip freeze | wc -l)"
        echo "fingerprint: $(pip freeze | grep -viE '^(-e|#|bcipy)' | sort | sha256sum)"
    - name: Unit test
      if: always()
      run: |
        set +e
        xvfb-run coverage run --branch --source=bcipy -m pytest --mpl -k "not slow"
        if [ $? -eq 0 ]b
        then 
          echo "Ubuntu run complete!"
        elif [ $? -eq 134 ]
        then
          echo "Ubuntu tests run successfully, memory issues may be present"
          exit 0
        else 
          echo "Ubuntu test failure"
        fi
    - name: type-check
      run: |
        make type
    - name: lint
      run: |
        make lint
    - name: Summary
      if: always()
      run: |
        python -c "import wx; print('SUMMARY wxPython', wx.version())"
        echo "SUMMARY packages: $(pip freeze | wc -l)"
        echo "SUMMARY fingerprint: $(pip freeze | grep -viE '^(-e|#|bcipy)' | sort | sha256sum)"
        pip freeze | grep -viE '^(-e|#|bcipy)' | sort > /tmp/freeze.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: freeze-${{ matrix.variant }}
        path: /tmp/freeze.txt
